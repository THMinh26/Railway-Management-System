<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Railway Booking</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/config.js"></script>
  </head>
  <body>
    <header>
      <nav class="navbar">
        <div class="container">
          <div class="logo">
            <h1>🚂 Railway Booking</h1>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <section class="auth-section">
        <div class="container">
          <div class="auth-card">
            <h2>Create Your Account</h2>
            <form id="registerForm">
              <div class="form-group">
                <label for="username">Username</label>
                <input
                  type="text"
                  id="username"
                  name="username"
                  placeholder="Choose a username (3-15 characters)"
                  pattern="[a-zA-Z0-9_]{3,15}"
                  title="Username must be 3-15 characters (letters, numbers, underscore only)"
                  required
                />
              </div>
              <div class="form-group">
                <label for="fullname">Full Name</label>
                <input
                  type="text"
                  id="fullname"
                  name="fullname"
                  placeholder="Enter your full name"
                  maxlength="30"
                  required
                />
              </div>
              <div class="form-group">
                <label for="email">Email</label>
                <input
                  type="email"
                  id="email"
                  name="email"
                  placeholder="Enter your email"
                  maxlength="50"
                  required
                />
              </div>
              <div class="form-group">
                <label for="phone">Phone Number</label>
                <input
                  type="tel"
                  id="phone"
                  name="phone"
                  placeholder="Enter your phone number (10-15 digits)"
                  pattern="\d{10,15}"
                  title="Phone number must be 10-15 digits"
                  required
                />
              </div>
              <div class="form-group">
                <label for="password">Password</label>
                <input
                  type="password"
                  id="password"
                  name="password"
                  placeholder="Create a password (min. 6 characters)"
                  minlength="6"
                  required
                />
              </div>
              <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input
                  type="password"
                  id="confirmPassword"
                  name="confirmPassword"
                  placeholder="Re-enter your password"
                  minlength="6"
                  required
                />
              </div>
              <br />
              <button type="submit" class="btn btn-primary btn-block">
                Register
              </button>
            </form>
            <p class="auth-link">
              Already have an account? <a href="login.html">Login here</a>
            </p>
            <div id="message" class="message"></div>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <div class="container">
        <p>&copy; 2025 Railway Booking System. All rights reserved.</p>
      </div>
    </footer>

    <script src="js/animations.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
