<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Bookings - Railway Booking</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="container">
        <div class="top-bar-content">
          <div class="top-links">
            <a href="#">Help & Support</a>
            <a href="admin.html">Admin Panel</a>
          </div>
          <div class="top-auth">
            <a href="login.html" class="btn-link">Sign In</a>
            <a href="register.html" class="btn-link">Register</a>
          </div>
        </div>
      </div>
    </div>

    <header>
      <nav class="navbar">
        <div class="container">
          <div class="logo">
            <div class="logo-icon">
              <svg width="60" height="40" viewBox="0 0 40 40">
                <rect width="40" height="40" fill="#E31E24" rx="4" />
                <text x="20" y="28" font-size="24" font-weight="bold" fill="white" text-anchor="middle">RMT</text>
              </svg>
            </div>
            <div class="logo-text">
              <h1>National Railway</h1>
              <span>Official Booking Portal</span>
            </div>
          </div>
          <ul class="nav-menu">
            <li><a href="index.html">Home</a></li>
            <li><a href="times.html">Train Times</a></li>
            <li><a href="bookings.html" class="active">My Bookings</a></li>
          </ul>
        </div>
      </nav>
    </header>

    <main>
      <section class="bookings-section">
        <div class="container">
          <h2>My Bookings</h2>
          <div id="bookingsList" class="bookings-list">
            <p>Loading your bookings...</p>
          </div>
        </div>
      </section>
    </main>

    <!-- Booking Details Modal -->
    <div id="detailsModal" class="modal">
      <div class="modal-content">
        <span class="close" onclick="closeDetailsModal()">&times;</span>
        <h2>Booking Details</h2>
        <div id="modalContent"></div>
      </div>
    </div>

    <footer>
      <div class="container">
        <p>&copy; 2025 Railway Booking System. All rights reserved.</p>
      </div>
    </footer>

    <script src="js/animations.js"></script>
    <script src="js/main.js"></script>
    <script src="js/bookings.js"></script>
  </body>
</html>
